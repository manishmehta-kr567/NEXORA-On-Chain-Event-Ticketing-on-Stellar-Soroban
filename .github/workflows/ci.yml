name: NEXORA CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Smart Contract Tests ─────────────────────────────────────────────────
  contract-tests:
    name: ⬡ Soroban Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v22.0.0/stellar-cli-22.0.0-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv stellar /usr/local/bin/

      - name: Build WASM contracts
        run: |
          cargo clean
          cargo build --target wasm32-unknown-unknown --release -p event-ticket
          cargo build --target wasm32-unknown-unknown --release -p marketplace

      - name: Run contract unit tests
        run: cargo test --workspace -- --nocapture
        working-directory: ./

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts
          path: |
            target/wasm32-unknown-unknown/release/*.wasm
            target/wasm32-unknown-unknown/release/*.optimized.wasm

  # ─── Frontend Tests ───────────────────────────────────────────────────────
  frontend-tests:
    name: ◈ Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test -- --reporter=verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results/

  # ─── Frontend Build ───────────────────────────────────────────────────────
  frontend-build:
    name: ◎ Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-tests
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SOROBAN_RPC: https://soroban-testnet.stellar.org
          VITE_HORIZON_URL: https://horizon-testnet.stellar.org
          VITE_EVENT_CONTRACT: CAIRVZ6DNVMH543WDVD5FPYF5UMOYSQSA4C5D5R5GVF5WJG54H7EVRMC
          VITE_MARKETPLACE_CONTRACT: CB37Z3TFONEVJV5LT5FSE52AOAUPL6XSNI33527MUZAPJSYVZW42CKDE

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/



  # ─── Contract Deploy (testnet) ────────────────────────────────────────────
  deploy-contracts:
    name: ⬡ Deploy Contracts to Testnet
    runs-on: ubuntu-latest
    needs: contract-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Stellar CLI
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/download/v22.0.0/stellar-cli-22.0.0-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv stellar /usr/local/bin/

      - name: Configure testnet identity
        run: |
          stellar keys generate deployer --network testnet
          stellar keys fund deployer --network testnet

      - name: Build & deploy event-ticket contract
        run: |
          cargo clean -p event-ticket
          cargo build --target wasm32-unknown-unknown --release -p event-ticket
          EVENT_CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/event_ticket.wasm \
            --source deployer \
            --network testnet)
          echo "EVENT_CONTRACT_ID=$EVENT_CONTRACT_ID" >> $GITHUB_ENV
          echo "Deployed EventTicket: $EVENT_CONTRACT_ID"

      - name: Build & deploy marketplace contract
        run: |
          cargo clean -p marketplace
          cargo build --target wasm32-unknown-unknown --release -p marketplace
          MARKETPLACE_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/marketplace.wasm \
            --source deployer \
            --network testnet)
          echo "MARKETPLACE_ID=$MARKETPLACE_ID" >> $GITHUB_ENV
          echo "Deployed Marketplace: $MARKETPLACE_ID"

      - name: Initialize contracts
        run: |
          DEPLOYER_ADDR=$(stellar keys address deployer)
          stellar contract invoke \
            --id $EVENT_CONTRACT_ID \
            --source deployer \
            --network testnet \
            -- initialize \
            --admin $DEPLOYER_ADDR

          stellar contract invoke \
            --id $MARKETPLACE_ID \
            --source deployer \
            --network testnet \
            -- initialize \
            --admin $DEPLOYER_ADDR \
            --event_contract $EVENT_CONTRACT_ID

      - name: Output deployment summary
        run: |
          echo "## Contract Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Address |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| EventTicket | \`$EVENT_CONTRACT_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Marketplace | \`$MARKETPLACE_ID\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Network | Stellar Testnet |" >> $GITHUB_STEP_SUMMARY
